apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: polaris
  labels:
    app: polaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
    spec:
      serviceAccountName: polaris
      containers:
        - name: polaris
          image: polaris:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POLARIS_KUBERNETES_MODE
              value: "in-cluster"
            - name: POLARIS_SERVER_PORT
              value: "8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: polaris
spec:
  selector:
    app: polaris
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
